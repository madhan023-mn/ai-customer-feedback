<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Background Glow & Grid -->
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Top Bar / Window Header -->
  <rect x="0" y="0" width="1000" height="42" fill="#0b1120"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#eab308"/>
  <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>
  <text x="500" y="26" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Project LOOP — Executive Analytics Dashboard</text>

  <!-- Navigation Bar -->
  <rect x="0" y="42" width="1000" height="48" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="24" y="72" fill="#6366f1" font-size="18" font-weight="800">🔄 LOOP</text>
  <rect x="110" y="54" width="90" height="26" rx="6" fill="#1e1b4b"/>
  <text x="155" y="71" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">Dashboard</text>
  <text x="235" y="71" fill="#94a3b8" font-size="12" font-weight="500">Inbox</text>
  <text x="295" y="71" fill="#94a3b8" font-size="12" font-weight="500">Themes</text>
  <text x="365" y="71" fill="#94a3b8" font-size="12" font-weight="500">Ask LOOP</text>
  <text x="445" y="71" fill="#94a3b8" font-size="12" font-weight="500">VoC Reports</text>
  <rect x="880" y="54" width="95" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="895" cy="67" r="7" fill="#6366f1"/>
  <text x="935" y="71" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">ADMIN</text>

  <!-- Main Body -->
  <!-- Negativity Spike Alert Banner -->
  <rect x="24" y="102" width="952" height="46" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="44" y="130" fill="#f87171" font-size="16">🔥</text>
  <text x="70" y="130" fill="#fecaca" font-size="13" font-weight="700">Negativity Spike Detected:</text>
  <text x="240" y="130" fill="#fca5a5" font-size="13">"Mobile App &amp; Checkout Failure" feedback spiked by +68% over the last 7-day period.</text>

  <!-- KPI Metric Cards -->
  <!-- Card 1 -->
  <rect x="24" y="160" width="226" height="88" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="44" y="185" fill="#94a3b8" font-size="12" font-weight="500">Total Feedback Ingested</text>
  <text x="44" y="222" fill="#f8fafc" font-size="28" font-weight="800">1,248</text>
  <text x="180" y="222" fill="#22c55e" font-size="12" font-weight="700">+14.2%</text>

  <!-- Card 2 -->
  <rect x="266" y="160" width="226" height="88" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="286" y="185" fill="#94a3b8" font-size="12" font-weight="500">Net Sentiment Score</text>
  <text x="286" y="222" fill="#38bdf8" font-size="28" font-weight="800">+0.42</text>
  <text x="420" y="222" fill="#94a3b8" font-size="11">Range -1 to 1</text>

  <!-- Card 3 -->
  <rect x="508" y="160" width="226" height="88" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="528" y="185" fill="#94a3b8" font-size="12" font-weight="500">Actioned Resolution Rate</text>
  <text x="528" y="222" fill="#a855f7" font-size="28" font-weight="800">86.4%</text>
  <text x="650" y="222" fill="#22c55e" font-size="12" font-weight="700">On Target</text>

  <!-- Card 4 -->
  <rect x="750" y="160" width="226" height="88" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="770" y="185" fill="#94a3b8" font-size="12" font-weight="500">Active Themes Tracked</text>
  <text x="770" y="222" fill="#f59e0b" font-size="28" font-weight="800">10 Themes</text>
  <text x="890" y="222" fill="#ef4444" font-size="12" font-weight="700">1 Spiking</text>

  <!-- Charts Row -->
  <!-- Volume Over Time Area Chart -->
  <rect x="24" y="260" width="596" height="300" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="44" y="290" fill="#f8fafc" font-size="15" font-weight="700">Feedback Volume &amp; Sentiment Trend Over Time</text>
  <text x="44" y="308" fill="#94a3b8" font-size="11">Daily incoming customer feedback distribution across 30 days</text>
  <!-- Chart Axes & Grid -->
  <line x1="60" y1="520" x2="580" y2="520" stroke="#334155" stroke-width="1"/>
  <line x1="60" y1="460" x2="580" y2="460" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="60" y1="400" x2="580" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="60" y1="340" x2="580" y2="340" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Area Curve -->
  <path d="M 60 480 Q 120 440, 180 470 T 300 420 T 420 380 T 520 330 L 580 340 L 580 520 L 60 520 Z" fill="url(#areaGrad)"/>
  <path d="M 60 480 Q 120 440, 180 470 T 300 420 T 420 380 T 520 330 L 580 340" fill="none" stroke="#6366f1" stroke-width="3"/>
  <path d="M 60 510 Q 120 500, 180 490 T 300 500 T 420 490 T 520 440 L 580 430" fill="none" stroke="#ef4444" stroke-width="2"/>
  
  <!-- Donut Sentiment Breakdown -->
  <rect x="636" y="260" width="340" height="300" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="656" y="290" fill="#f8fafc" font-size="15" font-weight="700">Sentiment Distribution</text>
  <text x="656" y="308" fill="#94a3b8" font-size="11">Classified via Multi-Layer AI Pipeline</text>

  <!-- Donut Rings -->
  <circle cx="806" cy="405" r="72" fill="none" stroke="#22c55e" stroke-width="22" stroke-dasharray="270 452" stroke-dashoffset="0"/>
  <circle cx="806" cy="405" r="72" fill="none" stroke="#eab308" stroke-width="22" stroke-dasharray="90 452" stroke-dashoffset="-270"/>
  <circle cx="806" cy="405" r="72" fill="none" stroke="#ef4444" stroke-width="22" stroke-dasharray="92 452" stroke-dashoffset="-360"/>
  <text x="806" y="405" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle">1,248</text>
  <text x="806" y="422" fill="#94a3b8" font-size="10" text-anchor="middle">TOTAL</text>

  <!-- Donut Legend -->
  <circle cx="680" cy="510" r="5" fill="#22c55e"/>
  <text x="692" y="514" fill="#cbd5e1" font-size="11">Positive (60%)</text>
  <circle cx="785" cy="510" r="5" fill="#eab308"/>
  <text x="797" y="514" fill="#cbd5e1" font-size="11">Neutral (20%)</text>
  <circle cx="885" cy="510" r="5" fill="#ef4444"/>
  <text x="897" y="514" fill="#cbd5e1" font-size="11">Negative (20%)</text>
</svg>
