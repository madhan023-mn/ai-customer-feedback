<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="42" fill="#0b1120"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#eab308"/>
  <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>
  <text x="500" y="26" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Project LOOP — Multi-Tenant Authentication &amp; RBAC</text>

  <!-- Background Decorative Circles -->
  <circle cx="200" cy="280" r="180" fill="#6366f1" opacity="0.08"/>
  <circle cx="800" cy="300" r="150" fill="#38bdf8" opacity="0.06"/>

  <!-- Center Auth Modal Card -->
  <rect x="290" y="65" width="420" height="480" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <text x="500" y="115" fill="#6366f1" font-size="28" font-weight="800" text-anchor="middle">🔄 LOOP</text>
  <text x="500" y="142" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Welcome back to Acme Corp</text>
  <text x="500" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">Sign in to your isolated workspace</text>

  <!-- Input 1: Email -->
  <text x="325" y="195" fill="#cbd5e1" font-size="11" font-weight="600">Email Address</text>
  <rect x="325" y="205" width="350" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="345" y="230" fill="#f8fafc" font-size="12">admin@acme.com</text>

  <!-- Input 2: Password -->
  <text x="325" y="268" fill="#cbd5e1" font-size="11" font-weight="600">Password</text>
  <rect x="325" y="278" width="350" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="345" y="303" fill="#f8fafc" font-size="14">••••••••••••</text>

  <!-- Sign In Button -->
  <rect x="325" y="335" width="350" height="42" rx="8" fill="url(#primaryGrad)"/>
  <text x="500" y="361" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Sign In to Dashboard ➔</text>

  <!-- RBAC Demo Roles Box -->
  <rect x="325" y="395" width="350" height="130" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="340" y="415" fill="#a5b4fc" font-size="10" font-weight="700">DEMO WORKSPACE PRE-SEEDED ROLES:</text>
  
  <text x="340" y="438" fill="#22c55e" font-size="10" font-weight="700">ADMIN:</text>
  <text x="395" y="438" fill="#94a3b8" font-size="10">admin@acme.com / password123 (Full Access)</text>

  <text x="340" y="462" fill="#38bdf8" font-size="10" font-weight="700">ANALYST:</text>
  <text x="405" y="462" fill="#94a3b8" font-size="10">analyst@acme.com / password123 (AI &amp; Triage)</text>

  <text x="340" y="486" fill="#f59e0b" font-size="10" font-weight="700">VIEWER:</text>
  <text x="395" y="486" fill="#94a3b8" font-size="10">viewer@acme.com / password123 (Read-Only)</text>
</svg>
