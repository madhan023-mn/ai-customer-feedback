<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="42" fill="#0b1120"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#eab308"/>
  <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>
  <text x="500" y="26" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Project LOOP — Real-Time AI Auto-Classification Engine</text>

  <!-- Nav -->
  <rect x="0" y="42" width="1000" height="48" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="24" y="72" fill="#6366f1" font-size="18" font-weight="800">🔄 LOOP</text>
  <text x="135" y="71" fill="#94a3b8" font-size="12" font-weight="500">Dashboard</text>
  <text x="205" y="71" fill="#94a3b8" font-size="12" font-weight="500">Inbox</text>
  <text x="275" y="71" fill="#94a3b8" font-size="12" font-weight="500">Themes</text>
  <text x="345" y="71" fill="#94a3b8" font-size="12" font-weight="500">Ask LOOP</text>
  <text x="425" y="71" fill="#94a3b8" font-size="12" font-weight="500">VoC Reports</text>

  <!-- Ingestion Source Card -->
  <rect x="24" y="105" width="460" height="440" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="45" y="138" fill="#f8fafc" font-size="16" font-weight="700">Raw Customer Feedback Entry</text>
  <text x="45" y="156" fill="#94a3b8" font-size="11">Ingested via Zendesk Webhook (#TK-89421)</text>

  <rect x="45" y="175" width="418" height="110" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="202" fill="#e2e8f0" font-size="13" font-style="italic">"We tried checking out on mobile during flash sale, but</text>
  <text x="60" y="224" fill="#e2e8f0" font-size="13" font-style="italic">the payment button freezes and deducts money without</text>
  <text x="60" y="246" fill="#e2e8f0" font-size="13" font-style="italic">generating an order confirmation! Terrible experience."</text>

  <text x="45" y="318" fill="#94a3b8" font-size="12" font-weight="600">Customer Identifier:</text>
  <text x="185" y="318" fill="#f8fafc" font-size="12">m.jensen@nordicretail.dk</text>

  <text x="45" y="348" fill="#94a3b8" font-size="12" font-weight="600">Channel Source:</text>
  <rect x="185" y="334" width="115" height="22" rx="4" fill="#312e81"/>
  <text x="242" y="349" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">SUPPORT_TICKET</text>

  <text x="45" y="388" fill="#94a3b8" font-size="12" font-weight="600">Processing Pipeline:</text>
  <text x="185" y="388" fill="#22c55e" font-size="12">BullMQ Worker ──► Completed (142ms)</text>

  <!-- AI Structured Output Card -->
  <rect x="508" y="105" width="468" height="440" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="528" y="125" width="130" height="26" rx="6" fill="url(#aiGrad)"/>
  <text x="593" y="142" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✨ AI CLASSIFIED</text>

  <!-- Output 1: Sentiment -->
  <rect x="528" y="165" width="428" height="60" rx="8" fill="#0b1120"/>
  <text x="545" y="190" fill="#94a3b8" font-size="11" font-weight="600">PREDICTED SENTIMENT &amp; SCORE</text>
  <rect x="545" y="198" width="55" height="20" rx="4" fill="#7f1d1d"/>
  <text x="572" y="212" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">NEG</text>
  <text x="615" y="212" fill="#ef4444" font-size="13" font-weight="800">-0.94</text>
  <text x="660" y="212" fill="#94a3b8" font-size="11">(Confidence: 98.4%)</text>

  <!-- Output 2: Feature Area -->
  <rect x="528" y="235" width="428" height="60" rx="8" fill="#0b1120"/>
  <text x="545" y="260" fill="#94a3b8" font-size="11" font-weight="600">PRODUCT FEATURE AREA</text>
  <text x="545" y="282" fill="#38bdf8" font-size="14" font-weight="700">Checkout / Billing &amp; Mobile UI</text>

  <!-- Output 3: Themes -->
  <rect x="528" y="305" width="428" height="75" rx="8" fill="#0b1120"/>
  <text x="545" y="328" fill="#94a3b8" font-size="11" font-weight="600">ASSIGNED THEMES &amp; CONFIDENCE WEIGHTS</text>
  <rect x="545" y="342" width="160" height="24" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="625" y="358" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">Payment Gateway Error (0.96)</text>
  <rect x="715" y="342" width="130" height="24" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="780" y="358" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">Mobile Freeze (0.88)</text>

  <!-- Output 4: Rationale -->
  <rect x="528" y="390" width="428" height="70" rx="8" fill="#0b1120"/>
  <text x="545" y="412" fill="#94a3b8" font-size="11" font-weight="600">AI EXPLANATION / RATIONALE</text>
  <text x="545" y="432" fill="#cbd5e1" font-size="11">"Critical transactional failure during checkout resulting in monetary deduction</text>
  <text x="545" y="448" fill="#cbd5e1" font-size="11">without order completion, representing high churn risk."</text>
</svg>
