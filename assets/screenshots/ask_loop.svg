<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="42" fill="#0b1120"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#eab308"/>
  <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>
  <text x="500" y="26" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Project LOOP — Ask LOOP (RAG Semantic Vector Q&amp;A)</text>

  <!-- Nav -->
  <rect x="0" y="42" width="1000" height="48" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="24" y="72" fill="#6366f1" font-size="18" font-weight="800">🔄 LOOP</text>
  <text x="135" y="71" fill="#94a3b8" font-size="12" font-weight="500">Dashboard</text>
  <text x="205" y="71" fill="#94a3b8" font-size="12" font-weight="500">Inbox</text>
  <text x="275" y="71" fill="#94a3b8" font-size="12" font-weight="500">Themes</text>
  <rect x="325" y="54" width="95" height="26" rx="6" fill="#1e1b4b"/>
  <text x="372" y="71" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">Ask LOOP</text>
  <text x="445" y="71" fill="#94a3b8" font-size="12" font-weight="500">VoC Reports</text>

  <!-- Query Box -->
  <rect x="24" y="105" width="952" height="52" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="48" y="136" fill="#f8fafc" font-size="14" font-weight="500">💬 "What are the most frequent complaints regarding the mobile checkout flow?"</text>
  <rect x="880" y="114" width="80" height="34" rx="6" fill="url(#ragGrad)"/>
  <text x="920" y="135" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Query ➔</text>

  <!-- Grounded AI Answer Card -->
  <rect x="24" y="172" width="600" height="380" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <rect x="44" y="192" width="160" height="24" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="124" y="208" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">✨ VECTOR-GROUNDED ANSWER</text>

  <text x="44" y="240" fill="#f8fafc" font-size="13" font-weight="600">Based on 14 retrieved customer feedback entries across Support &amp; App Store:</text>
  
  <text x="44" y="270" fill="#cbd5e1" font-size="12">1. <tspan fill="#f8fafc" font-weight="700">Payment Gateway Hangs:</tspan> Users report that clicking "Confirm Order" hangs</text>
  <text x="60" y="288" fill="#cbd5e1" font-size="12">indefinitely, causing double-charges without order confirmation emails.</text>

  <text x="44" y="318" fill="#cbd5e1" font-size="12">2. <tspan fill="#f8fafc" font-weight="700">iOS Autofill Crash:</tspan> iOS 18 users experience app crashes when using Safari</text>
  <text x="60" y="336" fill="#cbd5e1" font-size="12">autofill for credit card security codes (CVV).</text>

  <text x="44" y="366" fill="#cbd5e1" font-size="12">3. <tspan fill="#f8fafc" font-weight="700">Discount Code Desync:</tspan> Promo codes applied in the cart disappear</text>
  <text x="60" y="384" fill="#cbd5e1" font-size="12">at the final Stripe payment review screen.</text>

  <rect x="44" y="415" width="560" height="40" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="60" y="440" fill="#a7f3d0" font-size="11" font-weight="600">💡 Recommended Action: Prioritize Stripe SDK update &amp; fix iOS autofill exception handling.</text>

  <!-- Retrieved Source Citations Column -->
  <rect x="644" y="172" width="332" height="380" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="664" y="200" fill="#f8fafc" font-size="14" font-weight="700">Retrieved Evidence Sources</text>
  <text x="664" y="218" fill="#94a3b8" font-size="10">Ranked by Vector Cosine Similarity (Cosine &gt; 0.82)</text>

  <!-- Citation Card 1 -->
  <rect x="664" y="235" width="292" height="90" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="676" y="255" fill="#fca5a5" font-size="10" font-weight="700">SUPPORT_TICKET #4912 • Sim: 0.94</text>
  <text x="676" y="275" fill="#e2e8f0" font-size="10">"Payment button freezes during mobile checkout and deducts money twice..."</text>
  <text x="676" y="310" fill="#64748b" font-size="9">By: david.m@gmail.com • 2 days ago</text>

  <!-- Citation Card 2 -->
  <rect x="664" y="335" width="292" height="90" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="676" y="355" fill="#fca5a5" font-size="10" font-weight="700">APP_STORE REVIEW • Sim: 0.89</text>
  <text x="676" y="375" fill="#e2e8f0" font-size="10">"App crashed right when entering CVV. Lost my flash sale items!"</text>
  <text x="676" y="410" fill="#64748b" font-size="9">By: iOS User #9812 • 4 days ago</text>
</svg>
