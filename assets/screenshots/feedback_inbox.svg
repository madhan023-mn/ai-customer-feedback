<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="42" fill="#0b1120"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#eab308"/>
  <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>
  <text x="500" y="26" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Project LOOP — Customer Feedback Inbox &amp; Triage</text>

  <!-- Nav -->
  <rect x="0" y="42" width="1000" height="48" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="24" y="72" fill="#6366f1" font-size="18" font-weight="800">🔄 LOOP</text>
  <text x="135" y="71" fill="#94a3b8" font-size="12" font-weight="500">Dashboard</text>
  <rect x="180" y="54" width="70" height="26" rx="6" fill="#1e1b4b"/>
  <text x="215" y="71" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">Inbox</text>
  <text x="285" y="71" fill="#94a3b8" font-size="12" font-weight="500">Themes</text>
  <text x="355" y="71" fill="#94a3b8" font-size="12" font-weight="500">Ask LOOP</text>
  <text x="435" y="71" fill="#94a3b8" font-size="12" font-weight="500">VoC Reports</text>

  <!-- Action Bar -->
  <rect x="24" y="102" width="400" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="44" y="126" fill="#64748b" font-size="13">🔍  Search feedback by keyword, user, or issue...</text>

  <!-- Quick Filter Presets -->
  <rect x="440" y="106" width="90" height="30" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="485" y="125" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">All Items</text>

  <rect x="540" y="106" width="120" height="30" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="125" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">🔥 Negative Spikes</text>

  <rect x="670" y="106" width="120" height="30" rx="6" fill="#14532d" stroke="#16a34a" stroke-width="1"/>
  <text x="730" y="125" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">⭐ Positive Praise</text>

  <rect x="800" y="106" width="100" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="850" y="125" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Untriaged</text>

  <!-- Feedback Table -->
  <rect x="24" y="155" width="952" height="400" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  
  <!-- Table Header -->
  <rect x="24" y="155" width="952" height="38" rx="10" fill="#111827"/>
  <text x="45" y="179" fill="#94a3b8" font-size="11" font-weight="700">FEEDBACK CONTENT</text>
  <text x="440" y="179" fill="#94a3b8" font-size="11" font-weight="700">CHANNEL</text>
  <text x="570" y="179" fill="#94a3b8" font-size="11" font-weight="700">SENTIMENT</text>
  <text x="700" y="179" fill="#94a3b8" font-size="11" font-weight="700">FEATURE AREA</text>
  <text x="860" y="179" fill="#94a3b8" font-size="11" font-weight="700">STATUS</text>

  <!-- Row 1 -->
  <line x1="24" y1="245" x2="976" y2="245" stroke="#1e293b" stroke-width="1"/>
  <text x="45" y="215" fill="#f8fafc" font-size="12" font-weight="600">"The new 2-factor authentication flow gets stuck in an infinite redirect loop on iOS."</text>
  <text x="45" y="233" fill="#64748b" font-size="10">Customer: sarah.j@enterprise.com • 12 mins ago</text>
  <rect x="440" y="206" width="90" height="22" rx="4" fill="#312e81"/>
  <text x="485" y="221" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">SUPPORT_TICKET</text>
  <rect x="570" y="206" width="60" height="22" rx="4" fill="#7f1d1d"/>
  <text x="600" y="221" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">NEG -0.85</text>
  <text x="700" y="221" fill="#cbd5e1" font-size="11">Authentication</text>
  <rect x="860" y="206" width="70" height="22" rx="4" fill="#854d0e"/>
  <text x="895" y="221" fill="#fef08a" font-size="10" font-weight="700" text-anchor="middle">REVIEWED</text>

  <!-- Row 2 -->
  <line x1="24" y1="315" x2="976" y2="315" stroke="#1e293b" stroke-width="1"/>
  <text x="45" y="285" fill="#f8fafc" font-size="12" font-weight="600">"Bulk export to CSV is blazing fast now! Huge shoutout to the engineering team."</text>
  <text x="45" y="303" fill="#64748b" font-size="10">Customer: alex.chen@acme.corp • 45 mins ago</text>
  <rect x="440" y="276" width="80" height="22" rx="4" fill="#064e3b"/>
  <text x="480" y="291" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">NPS_SURVEY</text>
  <rect x="570" y="276" width="60" height="22" rx="4" fill="#14532d"/>
  <text x="600" y="291" fill="#86efac" font-size="10" font-weight="700" text-anchor="middle">POS +0.92</text>
  <text x="700" y="291" fill="#cbd5e1" font-size="11">CSV &amp; Data Export</text>
  <rect x="860" y="276" width="70" height="22" rx="4" fill="#166534"/>
  <text x="895" y="291" fill="#bbf7d0" font-size="10" font-weight="700" text-anchor="middle">ACTIONED</text>

  <!-- Row 3 -->
  <line x1="24" y1="385" x2="976" y2="385" stroke="#1e293b" stroke-width="1"/>
  <text x="45" y="355" fill="#f8fafc" font-size="12" font-weight="600">"Payment gateway threw error 502 during checkout while using Visa card."</text>
  <text x="45" y="373" fill="#64748b" font-size="10">Customer: david99@gmail.com • 2 hours ago</text>
  <rect x="440" y="346" width="80" height="22" rx="4" fill="#1e1b4b"/>
  <text x="480" y="361" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">APP_STORE</text>
  <rect x="570" y="346" width="60" height="22" rx="4" fill="#7f1d1d"/>
  <text x="600" y="361" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">NEG -0.78</text>
  <text x="700" y="361" fill="#cbd5e1" font-size="11">Billing &amp; Payments</text>
  <rect x="860" y="346" width="70" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="895" y="361" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle">NEW</text>
</svg>
