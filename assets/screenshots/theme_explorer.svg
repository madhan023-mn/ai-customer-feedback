<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="42" fill="#0b1120"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#eab308"/>
  <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>
  <text x="500" y="26" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Project LOOP — Dynamic Theme Explorer &amp; Spike Detection</text>

  <!-- Nav -->
  <rect x="0" y="42" width="1000" height="48" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="24" y="72" fill="#6366f1" font-size="18" font-weight="800">🔄 LOOP</text>
  <text x="135" y="71" fill="#94a3b8" font-size="12" font-weight="500">Dashboard</text>
  <text x="205" y="71" fill="#94a3b8" font-size="12" font-weight="500">Inbox</text>
  <rect x="250" y="54" width="80" height="26" rx="6" fill="#1e1b4b"/>
  <text x="290" y="71" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">Themes</text>
  <text x="355" y="71" fill="#94a3b8" font-size="12" font-weight="500">Ask LOOP</text>
  <text x="435" y="71" fill="#94a3b8" font-size="12" font-weight="500">VoC Reports</text>

  <!-- Header -->
  <text x="24" y="125" fill="#f8fafc" font-size="20" font-weight="800">Theme Trends &amp; Sentiment Spike Monitor</text>
  <text x="24" y="145" fill="#94a3b8" font-size="12">Tracking period-over-period growth rates (Current 7 Days vs Prior 7 Days) with auto-spike alerts</text>

  <!-- Grid Cards -->
  <!-- Card 1: Spiking Theme -->
  <rect x="24" y="170" width="300" height="180" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
  <rect x="40" y="186" width="110" height="22" rx="4" fill="#7f1d1d"/>
  <text x="95" y="201" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">🔥 SPIKE +68%</text>
  <text x="40" y="235" fill="#f8fafc" font-size="15" font-weight="700">Payment Gateway Failures</text>
  <text x="40" y="255" fill="#94a3b8" font-size="11">Checkout &amp; Stripe tokenization errors</text>
  <line x1="40" y1="275" x2="300" y2="275" stroke="#334155" stroke-width="1"/>
  <text x="40" y="300" fill="#94a3b8" font-size="11">Volume: <tspan fill="#f8fafc" font-weight="700">42 items</tspan></text>
  <text x="170" y="300" fill="#94a3b8" font-size="11">Avg Sentiment: <tspan fill="#ef4444" font-weight="700">-0.88</tspan></text>
  <rect x="40" y="315" width="268" height="24" rx="4" fill="#312e81"/>
  <text x="174" y="331" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">View 42 Linked Feedbacks ➔</text>

  <!-- Card 2 -->
  <rect x="350" y="170" width="300" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <rect x="366" y="186" width="80" height="22" rx="4" fill="#14532d"/>
  <text x="406" y="201" fill="#86efac" font-size="11" font-weight="700" text-anchor="middle">STABLE</text>
  <text x="366" y="235" fill="#f8fafc" font-size="15" font-weight="700">Fast CSV Data Export</text>
  <text x="366" y="255" fill="#94a3b8" font-size="11">Praise for v2.4 bulk export speedup</text>
  <line x1="366" y1="275" x2="626" y2="275" stroke="#334155" stroke-width="1"/>
  <text x="366" y="300" fill="#94a3b8" font-size="11">Volume: <tspan fill="#f8fafc" font-weight="700">68 items</tspan></text>
  <text x="496" y="300" fill="#94a3b8" font-size="11">Avg Sentiment: <tspan fill="#22c55e" font-weight="700">+0.91</tspan></text>
  <rect x="366" y="315" width="268" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="331" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">View 68 Linked Feedbacks ➔</text>

  <!-- Card 3 -->
  <rect x="676" y="170" width="300" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <rect x="692" y="186" width="95" height="22" rx="4" fill="#1e1b4b"/>
  <text x="739" y="201" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">GROWING +12%</text>
  <text x="692" y="235" fill="#f8fafc" font-size="15" font-weight="700">Dark Mode UI Requests</text>
  <text x="692" y="255" fill="#94a3b8" font-size="11">User requests for OLED black themes</text>
  <line x1="692" y1="275" x2="952" y2="275" stroke="#334155" stroke-width="1"/>
  <text x="692" y="300" fill="#94a3b8" font-size="11">Volume: <tspan fill="#f8fafc" font-weight="700">29 items</tspan></text>
  <text x="822" y="300" fill="#94a3b8" font-size="11">Avg Sentiment: <tspan fill="#38bdf8" font-weight="700">+0.35</tspan></text>
  <rect x="692" y="315" width="268" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="826" y="331" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">View 29 Linked Feedbacks ➔</text>
</svg>
